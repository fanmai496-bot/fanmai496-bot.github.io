<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HTML Runner（オフライン対応）</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#1e1e1e;
  color:#fff;
}
header{
  padding:10px;
  background:#333;
  display:flex;
  gap:8px;
}
button{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
iframe{
  width:100%;
  height:calc(100vh - 56px);
  border:none;
  background:#fff;
}
</style>
</head>

<body>
<header>
  <input type="file" id="fileInput" accept="text/html">
  <button onclick="runHTML()">実行</button>
  <span id="status">online</span>
</header>

<iframe id="viewer"></iframe>

<script>
/* ===== Service Worker 登録 ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

/* ===== HTML実行 ===== */
function runHTML(){
  const f = document.getElementById('fileInput').files[0];
  if(!f){
    alert('HTMLファイルを選択してください');
    return;
  }
  const r = new FileReader();
  r.onload = ()=>{
    const html = r.result;
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    document.getElementById('viewer').src = url;

    // オフライン用に保存
    localStorage.setItem('lastHTML', html);
  };
  r.readAsText(f);
}

/* ===== オフライン復元 ===== */
window.addEventListener('load', ()=>{
  const saved = localStorage.getItem('lastHTML');
  if(saved){
    const blob = new Blob([saved], {type:'text/html'});
    document.getElementById('viewer').src = URL.createObjectURL(blob);
  }
});

/* ===== 状態表示 ===== */
function updateStatus(){
  document.getElementById('status').textContent =
    navigator.onLine ? 'online' : 'offline';
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();
</script>

</body>
</html>
